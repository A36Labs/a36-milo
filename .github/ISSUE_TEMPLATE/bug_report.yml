name: Bug report
description: Report a reproducible problem with A36 Milo
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve A36 Milo.

        Before submitting, search existing issues to avoid duplicates.

        Never include API keys, Telegram tokens, webhook secrets, private messages, user IDs, group IDs or production KV details.

        For security vulnerabilities, do not use this form. Follow SECURITY.md instead.

  - type: textarea
    id: problem
    attributes:
      label: Bug description
      description: Clearly explain what went wrong.
      placeholder: Describe the problem you experienced.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the problem.
      placeholder: |
        1. Send the command...
        2. Open...
        3. Milo responds...
        4. The error appears...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Explain what you expected Milo to do.
      placeholder: Milo should have...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Explain what Milo did instead.
      placeholder: Milo instead...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the part of Milo affected by the bug.
      options:
        - Telegram webhook
        - Private messages
        - Group messages
        - Untagged message detection
        - Commands
        - Gemini AI responses
        - Conversation memory
        - Multilingual responses
        - Cloudflare Workers KV
        - Scheduled prompts or observances
        - Message reactions
        - Deployment or configuration
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Frequently
        - Sometimes
        - Only once
        - Unable to reproduce consistently
    validations:
      required: true

  - type: input
    id: worker-version
    attributes:
      label: Milo version or commit
      description: Add the release version or Git commit when known.
      placeholder: v1.0.0 or commit hash

  - type: input
    id: wrangler-version
    attributes:
      label: Wrangler version
      description: Add the Wrangler version when relevant.
      placeholder: Example: 4.x.x

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment environment
      options:
        - Cloudflare production Worker
        - Cloudflare preview deployment
        - Local Wrangler development
        - Third-party deployment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or error messages
      description: Remove all secrets, tokens, personal data and production identifiers.
      render: shell
      placeholder: Paste sanitized logs here.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Add screenshots, links or other helpful context. Hide all private information.
      placeholder: Add any additional information here.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed all credentials, tokens and private information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
        - label: I included enough information to reproduce the problem.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
